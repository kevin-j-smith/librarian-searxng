# Publishes to PyPI when a `v*` tag is pushed, using PyPI Trusted Publishing
# (OIDC), so no API token is stored in this repository. A manual run
# (workflow_dispatch) publishes to TestPyPI instead, for a dry run.
#
# One-time setup: see RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: librarian-searxng
      - uses: actions/checkout@v4
        with:
          repository: kevin-j-smith/librarian
          path: librarian
      - uses: astral-sh/setup-uv@v6
      - name: Install librarian, then this plugin into its environment
        working-directory: librarian
        run: |
          uv sync --frozen
          uv pip install --no-deps -e ../librarian-searxng
      - name: Test
        working-directory: librarian-searxng
        run: ../librarian/.venv/bin/python -m pytest tests -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uvx --from hatchling hatchling version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/librarian-searxng
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/librarian-searxng
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
